<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'; object-src 'none'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<title>CatView EPUB</title>
<style>
:root{color-scheme:light dark;--paper:var(--paper-light,#FBFAF7);--ink:var(--ink-light,#2B3034);--muted:var(--muted-light,#69747B);--line:var(--line-light,#E0E4E1);--link:var(--link-light,#526C7B)}
@media(prefers-color-scheme:dark){:root{--paper:var(--paper-dark,#202225);--ink:var(--ink-dark,#EDF0F1);--muted:var(--muted-dark,#ABB3B9);--line:var(--line-dark,#3C4144);--link:var(--link-dark,#B6CAD5)}}
:root[data-theme=light]{color-scheme:light;--paper:var(--paper-light,#FBFAF7);--ink:var(--ink-light,#2B3034);--muted:var(--muted-light,#69747B);--line:var(--line-light,#E0E4E1);--link:var(--link-light,#526C7B)}
:root[data-theme=dark]{color-scheme:dark;--paper:var(--paper-dark,#202225);--ink:var(--ink-dark,#EDF0F1);--muted:var(--muted-dark,#ABB3B9);--line:var(--line-dark,#3C4144);--link:var(--link-dark,#B6CAD5)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{width:100%;height:100%;overflow:auto;overscroll-behavior:contain}
#chapter{width:min(100%,860px);min-height:100%;margin:0 auto;padding:42px 46px 90px;
  font-family:ui-serif,Georgia,"Songti SC","Hiragino Mincho ProN","Apple SD Gothic Neo",serif;
  font-size:17px;font-weight:400;line-height:1.85;overflow-wrap:break-word;hyphens:auto;text-align:start}
#chapter :first-child{margin-top:0}
#chapter p{margin:0 0 1em}
#chapter h1,#chapter h2,#chapter h3,#chapter h4,#chapter h5{font-weight:600;line-height:1.4;margin:1.5em 0 .65em}
#chapter h1{font-size:1.65em}#chapter h2{font-size:1.38em}#chapter h3{font-size:1.18em}
#chapter img{display:block;max-width:100%;max-height:70vh;height:auto;width:auto;margin:1.6em auto;object-fit:contain}
#chapter figure{margin:1.7em 0}#chapter figcaption{text-align:center;font-size:.8em;color:var(--muted)}
#chapter ruby{ruby-position:over}#chapter rt{font-size:.55em;font-weight:400}
#chapter blockquote{margin:1.6em 0;padding:.2em 1.1em;border-inline-start:2px solid var(--muted);color:var(--muted)}
#chapter pre{overflow:auto;max-width:100%;padding:1.1em;border:1px solid var(--line);border-radius:6px;line-height:1.5;font-size:.82em;font-family:ui-monospace,Menlo,monospace}
#chapter code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}
#chapter table{display:block;max-width:100%;width:max-content;overflow-x:auto;border-collapse:collapse;margin:1.3em 0;font-size:.9em}
#chapter td,#chapter th{border:1px solid var(--line);padding:.5em .8em}
#chapter ul,#chapter ol{padding-inline-start:1.6em}#chapter li{margin:.25em 0}
#chapter a{color:var(--link);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:.15em}
#chapter hr{border:0;border-top:1px solid var(--line);margin:2em 0}
#viewport.vertical{overflow-x:auto;overflow-y:hidden}
#viewport.vertical #chapter{writing-mode:vertical-rl;text-orientation:mixed;width:max-content;max-width:none;min-width:100%;height:100%;min-height:0;margin:0;padding:30px 42px 30px 86px}
#viewport.vertical #chapter img{max-height:80%;max-width:55vw}
#viewport.vertical #chapter table{writing-mode:horizontal-tb}
@media(max-width:620px){#chapter{padding:30px 22px 70px}#viewport.vertical #chapter{padding:20px 22px 20px 54px}}
</style>
</head>
<body>
<div id="viewport" tabindex="0"><article id="chapter"></article></div>
<script type="application/json" id="book-data">__BOOK_JSON__</script>
<script nonce="__NONCE__">
'use strict';
(() => {
  const book=JSON.parse(document.getElementById('book-data').textContent);
  const viewport=document.getElementById('viewport');
  const chapter=document.getElementById('chapter');
  const vertical=Boolean(book.vertical);
  viewport.classList.toggle('vertical',vertical);
  viewport.dir=book.direction==='rtl'?'rtl':'ltr';
  document.documentElement.lang=book.language||'en';
  document.title=book.title||'CatView';
  let chapterIndex=0;
  let pendingRestore=null;
  const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
  const maxScroll=()=>vertical?Math.max(0,viewport.scrollWidth-viewport.clientWidth):Math.max(0,viewport.scrollHeight-viewport.clientHeight);
  function fraction(){const max=maxScroll();if(!max)return 0;return clamp((vertical?Math.abs(viewport.scrollLeft):viewport.scrollTop)/max,0,1)}
  function setFamilies(reading,code){
    let style=document.getElementById('reader-font-families');
    if(!style){style=document.createElement('style');style.id='reader-font-families';document.head.appendChild(style)}
    style.textContent='body,#chapter{font-family:'+reading+'}#chapter pre,#chapter code{font-family:'+code+'}';
  }
  function setFont(value){chapter.style.fontSize=clamp(Number(value)||17,12,48)+'px'}
  function setLayout(lineHeight,width){
    chapter.style.lineHeight=clamp(Number(lineHeight)||1.75,1.4,2).toString();
    if(!vertical)chapter.style.width='min(100%,'+clamp(Number(width)||800,700,1100)+'px)';
  }
  function setTheme(mode){document.documentElement.dataset.theme=mode===1?'light':mode===2?'dark':'auto'}
  function setAccent(light,dark,colors){
    if(colors)document.documentElement.style.cssText=colors;
    document.documentElement.style.setProperty('--link-light',light||'#526C7B');
    document.documentElement.style.setProperty('--link-dark',dark||'#B6CAD5');
  }
  function restorePosition(){
    if(!pendingRestore)return;
    if(viewport.clientWidth<20||viewport.clientHeight<20)return;
    const {index,anchor,progress}=pendingRestore;
    if(index!==chapterIndex){pendingRestore=null;return}
    if(anchor){
      const target=document.getElementById('cv-'+index+'-'+anchor);
      if(target){target.scrollIntoView({block:'start',inline:'start'});pendingRestore=null;return}
    }
    const max=maxScroll();
    if(progress>0 && max<=0)return;
    const distance=max*progress;
    if(vertical)viewport.scrollLeft=-distance;
    else viewport.scrollTop=distance;
    pendingRestore=null;
  }
  function goTo(index,anchor='',progress=0){
    const next=clamp(Number(index)||0,0,book.chapters.length-1);
    chapterIndex=next;
    chapter.innerHTML=book.chapters[next].html;
    chapter.lang=book.language||'en';
    chapter.dir=book.direction||'ltr';
    pendingRestore={index:next,anchor,progress:clamp(Number(progress)||0,0,1)};
    viewport.scrollTop=0;viewport.scrollLeft=0;
    requestAnimationFrame(()=>requestAnimationFrame(restorePosition));
  }
  const resizeObserver=new ResizeObserver(restorePosition);
  resizeObserver.observe(viewport);
  resizeObserver.observe(chapter);
  function nextChapter(){if(chapterIndex+1<book.chapters.length)goTo(chapterIndex+1)}
  function previousChapter(){if(chapterIndex>0)goTo(chapterIndex-1)}
  function step(forward){
    const max=maxScroll(),current=max*fraction();
    const size=(vertical?viewport.clientWidth:viewport.clientHeight)*.88;
    if(forward&&current>=max-4){if(chapterIndex+1<book.chapters.length)nextChapter();return}
    if(!forward&&current<=4){if(chapterIndex>0)goTo(chapterIndex-1,'',1);return}
    if(vertical)viewport.scrollBy({left:(forward?-1:1)*size,behavior:'smooth'});
    else viewport.scrollBy({top:(forward?1:-1)*size,behavior:'smooth'});
  }
  function position(){return{chapter:chapterIndex,fraction:pendingRestore?.progress??fraction()}}
  viewport.addEventListener('click',e=>{
    const link=e.target.closest?.('a[href]');
    if(!link)return;
    e.preventDefault();
    const m=(link.getAttribute('href')||'').match(/^#cv-(\d+)(?:-(.*))?$/);
    if(m)goTo(Number(m[1]),m[2]||'');
  });
  document.addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    const nextKey=vertical||book.direction==='rtl'?'ArrowLeft':'ArrowRight';
    const prevKey=vertical||book.direction==='rtl'?'ArrowRight':'ArrowLeft';
    if(e.key===nextKey||e.key==='PageDown'||(e.key===' '&&!e.shiftKey)){e.preventDefault();step(true)}
    else if(e.key===prevKey||e.key==='PageUp'||(e.key===' '&&e.shiftKey)){e.preventDefault();step(false)}
  });
  window.catviewReader=Object.freeze({
    goTo,nextPage:()=>step(true),previousPage:()=>step(false),
    nextChapter,previousChapter,setFamilies,setFont,setTheme,setLayout,setAccent,position
  });
  setFont(book.fontSize);setTheme(book.themeMode);setLayout(book.lineHeight,book.readerWidth);setAccent(book.linkLight,book.linkDark,book.colors);
  goTo(book.position?.chapter??0,'',book.position?.fraction??0);
})();
</script>
</body>
</html>
